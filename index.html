<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Dashboard - Monitoring Window</title>
<script src="config.js"></script>
<style>
  :root {
    --bg:#0e1015; --panel:#161922; --panel2:#1c2030; --line:#2a2f42; --fg:#e6e8ef;
    --muted:#8a90a6; --accent:#35d0a5; --blue:#5aa2ff; --amber:#ffb454; --red:#ff6b7a; --violet:#b48cff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; }
  header { position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 18px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  header h1 { font-size:15px; margin:0 6px 0 0; }
  .pill { padding:3px 10px; border-radius:999px; border:1px solid var(--line); font-size:12px; background:var(--panel2); }
  .pill.ok { color:var(--accent); border-color:#245a4b; }
  .pill.warn { color:var(--amber); border-color:#6a4d1c; }
  .pill.bad { color:var(--red); border-color:#6a2530; }
  .spacer { flex:1; }
  select, input[type=text], button { background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 9px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  label.chk { display:flex; gap:5px; align-items:center; color:var(--muted); }
  nav { display:flex; gap:2px; padding:10px 18px 0; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--muted); padding:8px 14px; }
  nav button.on { color:var(--fg); border-bottom-color:var(--accent); }
  main { padding:16px 18px 60px; }
  section { display:none; } section.on { display:block; }
  .banner { margin:12px 18px 0; padding:10px 14px; border-radius:8px; border:1px solid; }
  .banner.warn { background:#2a2113; border-color:#6a4d1c; color:var(--amber); }
  .banner.bad { background:#2a1319; border-color:#6a2530; color:var(--red); }
  .banner code { background:#0003; padding:1px 5px; border-radius:4px; user-select:all; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:11px 13px; }
  .kpi b { display:block; font-size:22px; color:var(--accent); } .kpi span { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .kpi small { display:block; color:var(--muted); margin-top:2px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; overflow:auto; }
  .card h3 { margin:0 0 9px; font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:5px 8px; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0; background:var(--panel); }
  td { padding:5px 8px; border-bottom:1px solid #20243200; border-bottom:1px solid #232739; vertical-align:top; }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--panel2); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); } .mono { font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  .tag { display:inline-block; padding:0 7px; border-radius:4px; font-size:11px; border:1px solid var(--line); }
  .tag.user_action { color:var(--blue); } .tag.api { color:var(--violet); } .tag.error { color:var(--red); border-color:#6a2530; } .tag.session { color:var(--accent); }
  .ok { color:var(--accent); } .fail { color:var(--red); font-weight:600; }
  .bar { height:8px; background:var(--blue); border-radius:4px; min-width:2px; }
  .bar.g { background:var(--accent); } .bar.r { background:var(--red); } .bar.a { background:var(--amber); }
  .barrow { display:grid; grid-template-columns:150px 1fr 56px; gap:8px; align-items:center; margin:3px 0; }
  .barrow .l { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .barrow .v { text-align:right; font-variant-numeric:tabular-nums; }
  .hours { display:grid; grid-template-columns:repeat(24,1fr); gap:3px; align-items:end; height:90px; }
  .hours div { background:var(--blue); border-radius:3px 3px 0 0; min-height:2px; position:relative; }
  .hlab { display:grid; grid-template-columns:repeat(24,1fr); gap:3px; color:var(--muted); font-size:10px; text-align:center; margin-top:3px; }
  .funnel .step { display:grid; grid-template-columns:170px 1fr 120px; gap:10px; align-items:center; margin:6px 0; }
  .empty { color:var(--muted); padding:18px; text-align:center; }
  @keyframes flash { from { background:#35d0a533; } to { background:transparent; } }
  tr.new td { animation:flash 3.5s ease-out; }
  #drawer { position:fixed; top:0; right:0; bottom:0; width:min(760px,96vw); background:var(--panel); border-left:1px solid var(--line); box-shadow:-12px 0 30px #0008; transform:translateX(105%); transition:transform .18s; z-index:30; display:flex; flex-direction:column; }
  #drawer.open { transform:none; }
  #drawer .dh { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  #drawer .db { padding:10px 16px; overflow:auto; flex:1; }
  .live-top { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); display:inline-block; box-shadow:0 0 0 0 #35d0a5aa; animation:pulse 1.6s infinite; }
  .dot.off { background:var(--muted); animation:none; }
  @keyframes pulse { 70% { box-shadow:0 0 0 8px #35d0a500; } 100% { box-shadow:0 0 0 0 #35d0a500; } }
  /* Login gate (public site only). Covers everything; no data is requested until it is passed. */
  #gate { position:fixed; inset:0; z-index:100; background:var(--bg); display:none; align-items:center; justify-content:center; padding:20px; }
  #gate.show { display:flex; }
  #gate form { width:min(360px,100%); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:26px 24px; box-shadow:0 20px 60px #0009; }
  #gate h2 { margin:0 0 4px; font-size:17px; } #gate p { margin:0 0 18px; color:var(--muted); }
  #gate label { display:block; color:var(--muted); font-size:12px; margin:12px 0 4px; }
  #gate input { width:100%; padding:9px 11px; font:inherit; color:var(--fg); background:var(--panel2); border:1px solid var(--line); border-radius:6px; }
  #gate input:focus { outline:none; border-color:var(--accent); }
  #gate button { width:100%; margin-top:18px; padding:10px; background:var(--accent); color:#04130e; border:0; font-weight:600; border-radius:6px; }
  #gate button:disabled { opacity:.6; cursor:wait; }
  #gate .err { color:var(--red); min-height:18px; margin-top:12px; font-size:12px; }
  body.locked > header, body.locked > nav, body.locked > main, body.locked > #banners { display:none; }
</style>
</head>
<body class="locked">
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gtitle">
  <form id="gform" autocomplete="off">
    <h2 id="gtitle">Monitoring Window</h2>
    <p>Sign in to view Sales Dashboard activity.</p>
    <label for="gid">ID</label>
    <input id="gid" name="id" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label for="gpw">Password</label>
    <input id="gpw" name="password" type="password" autocomplete="current-password" required>
    <div class="err" id="gerr" role="alert"></div>
    <button type="submit" id="gbtn">Sign in</button>
  </form>
</div>
<header>
  <h1>Sales Dashboard - Monitoring Window</h1>
  <span id="health" class="pill">connecting...</span>
  <span id="active" class="pill">active now: -</span>
  <span class="spacer"></span>
  <label class="muted">Range
    <select id="range">
      <option value="1h">Last hour</option><option value="6h">Last 6 hours</option>
      <option value="24h">Last 24 hours</option><option value="7d" selected>Last 7 days</option>
      <option value="30d">Last 30 days</option><option value="all">All time</option>
    </select>
  </label>
  <label class="muted">Sales agent <select id="userf"><option value="">All agents</option></select></label>
  <label class="chk"><input type="checkbox" id="auto" checked> auto-refresh</label>
  <button id="reload">Reload</button>
  <button id="logout" style="display:none">Sign out</button>
</header>
<div id="banners"></div>
<nav id="tabs"></nav>
<main>
  <section id="t-live"></section><section id="t-overview"></section><section id="t-users"></section>
  <section id="t-usersummary"></section>
  <section id="t-sessions"></section><section id="t-bookings"></section><section id="t-customers"></section>
  <section id="t-instructors"></section><section id="t-api"></section><section id="t-errors"></section>
</main>
<aside id="drawer"><div class="dh"><b id="dtitle">Session</b><span class="spacer"></span><button id="dclose">Close</button></div><div class="db" id="dbody"></div></aside>

<script>
"use strict";
// ------------------------------------------------------------------ helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
// Errors reach this page as strings, plain objects or serialized Error values.
// Stringifying an object directly renders "[object Object]", so walk the usual
// fields first and only then fall back to JSON (never to String(object)).
const errText = (e) => {
  if (e == null || e === "") return "";
  if (typeof e === "string") return e;
  if (typeof e !== "object") return String(e);
  const m = e.message ?? e.error ?? e.hint ?? e.detail ?? e.code;
  if (typeof m === "string" && m) return m;
  try { const j = JSON.stringify(e); return j && j !== "{}" ? j : ""; } catch { return ""; }
};
const nf = (n) => Number(n || 0).toLocaleString();
const pct = (a, b) => (b ? Math.round((a / b) * 1000) / 10 + "%" : "-");
// created can exceed started (a booking may create several classes, or a flow
// may not pass through "started"), so a rate above 100% is not a conversion.
const conv = (c, s) => (c > s ? "n/a (more created than started)" : pct(c, s));
const fmtDur = (ms) => {
  if (ms == null || !isFinite(ms)) return "-";
  const s = Math.round(ms / 1000);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m " + (s % 60) + "s";
  return Math.floor(m / 60) + "h " + (m % 60) + "m";
};
const ago = (ts) => fmtDur(Date.now() - new Date(ts).getTime()) + " ago";
const tm = (ts) => new Date(ts).toLocaleString(undefined, { hour12: false, month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
const dt = (ts) => new Date(ts).toLocaleString([], { hour12: false, month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
const quantile = (sorted, q) => (sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(q * sorted.length))] : null);
const inc = (m, k, by = 1) => m.set(k, (m.get(k) || 0) + by);
const topN = (m, n = 10) => [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, n);
// Course ids recorded on booking_created -> friendly English labels.
const courseLabel = (c) => ({ demo: "Demo", course_4: "4-class", course_5: "5-class", course_6: "6-class", course_10: "10-class", course_15: "15-class", course_20: "20-class" }[c] || c || "?");
const busiestDay = (m) => { let best = null; for (const [d, n] of m) if (!best || n > best[1]) best = [d, n]; return best; };

let rows = [];            // analytics window, ascending by ts
let names = {};           // instructor id -> name
let health = null;
let lastSeen = new Map(); // user -> last received_at/ts ms (analytics + live)
const uname = (r) => r.user_name || r.user_id || (r.auth_user_id ? r.auth_user_id.slice(0, 8) : "") || "(unknown)";
const iname = (id) => (id ? names[id] || id.slice(0, 8) + "..." : "-");

// Two data sources, one page:
//   local  : the page is served by server.mjs, which has the service-role key
//            and answers /api/* (full data, never leaves this machine).
//   public : the page is on GitHub Pages. config.js provides the project URL
//            and the PUBLIC anon key, and the page calls the read-only
//            monitoring_feed_* database functions (setup.sql), which return
//            the rows with customer names already removed on the server.
const CFG = window.MONITOR_CONFIG || {};
const PUBLIC_MODE = !!(CFG.supabaseUrl && CFG.anonKey);
const POLL_MS = PUBLIC_MODE ? 5000 : 2000;
const REFRESH_MS = PUBLIC_MODE ? 60000 : 30000;

async function rpc(fn, args) {
  const r = await fetch(`${CFG.supabaseUrl}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: CFG.anonKey, Authorization: "Bearer " + CFG.anonKey, "Content-Type": "application/json" },
    body: JSON.stringify(args || {}),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const notSetUp = j?.code === "PGRST202" || r.status === 404;
    // HTTP/2 has no reason phrase, so r.statusText is often "" -- without the
    // status fallback Error.message becomes empty and every caller that prints
    // it falls back to the raw object, i.e. "[object Object]".
    throw Object.assign(new Error(errText(j?.message) || errText(j) || r.statusText || `HTTP ${r.status}`), {
      body: j,
      notSetUp,
      hint: notSetUp ? "The monitoring backend is not set up yet: the site owner needs to run setup.sql once in the Supabase SQL editor." : undefined,
    });
  }
  return j;
}

async function api(path) {
  if (PUBLIC_MODE) {
    const u = new URL(path, "http://x");
    const q = u.searchParams;
    if (u.pathname === "/api/health") return rpc("monitoring_feed_health");
    if (u.pathname === "/api/instructors") return rpc("monitoring_feed_instructors");
    if (u.pathname === "/api/rows") {
      const rows = await rpc("monitoring_feed_rows", { p_since: q.get("since") || null });
      return { rows, truncated: rows.length >= 20000 };
    }
    if (u.pathname === "/api/live") return { rows: await rpc("monitoring_feed_live", q.get("after") ? { p_after: q.get("after") } : {}) };
    throw new Error("unknown route " + path);
  }
  const r = await fetch(path);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(errText(j?.error) || r.statusText || `HTTP ${r.status}`), { body: j });
  return j;
}

function props(r) { return r.props && typeof r.props === "object" ? r.props : {}; }
// The app stores the customer name in props.customer_name (no dedicated column).
const cust = (r) => props(r).customer_name || r.customer_name || "";
function detail(r) {
  const p = [];
  if (r.api_name) p.push(`${r.http_method || ""} ${r.duration_ms != null ? r.duration_ms + "ms" : ""}${r.http_status ? " (" + r.http_status + ")" : ""}`.trim());
  if (r.instructor_id) p.push("instructor: " + esc(iname(r.instructor_id)));
  if (r.slot_date) p.push("slot: " + esc(r.slot_date) + (r.slot_start ? " " + esc(String(r.slot_start).slice(0, 5)) + (r.slot_end ? "-" + esc(String(r.slot_end).slice(0, 5)) : "") : ""));
  if (cust(r)) p.push("customer: " + esc(cust(r)));
  if (r.error_message) p.push('<span class="fail">' + esc(r.error_message) + "</span>");
  const kv = Object.entries(props(r)).filter(([k]) => k !== "customer_name").slice(0, 5).map(([k, v]) => esc(k) + "=" + esc(typeof v === "object" ? JSON.stringify(v) : v));
  if (kv.length) p.push('<span class="muted">' + kv.join(" ") + "</span>");
  return p.join(" &middot; ") || '<span class="muted">-</span>';
}
const result = (r) => (r.success === true ? '<span class="ok">ok</span>' : r.success === false ? '<span class="fail">FAIL</span>' : '<span class="muted">-</span>');
const tag = (c) => `<span class="tag ${esc(c)}">${esc(c)}</span>`;
function eventRow(r, cls = "") {
  return `<tr class="${cls}" title="${esc(JSON.stringify(r, null, 1))}"><td class="mono">${tm(r.ts)}</td><td>${esc(uname(r))}</td><td>${tag(r.category)}</td><td class="mono">${esc(r.event_name)}</td><td>${result(r)}</td><td>${detail(r)}</td></tr>`;
}
const eventTable = (list, cls) => `<table><thead><tr><th>When</th><th>Sales agent</th><th>Type</th><th>Event</th><th>Result</th><th>Details</th></tr></thead><tbody>${list.map((r) => eventRow(r, cls)).join("")}</tbody></table>`;
function bars(entries, cls = "", fmt = nf) {
  if (!entries.length) return '<div class="empty">no data</div>';
  const max = Math.max(...entries.map((e) => e[1]), 1);
  return entries.map(([l, v]) => `<div class="barrow"><span class="l" title="${esc(l)}">${esc(l)}</span><div><div class="bar ${cls}" style="width:${Math.max(1, (v / max) * 100)}%"></div></div><span class="v">${fmt(v)}</span></div>`).join("");
}
const card = (title, body) => `<div class="card"><h3>${esc(title)}</h3>${body}</div>`;
const kpi = (label, value, sub = "") => `<div class="kpi"><span>${esc(label)}</span><b>${value}</b>${sub ? `<small>${sub}</small>` : ""}</div>`;

// ----------------------------------------------------------------- analysis
function analyze(list) {
  const A = { list };
  A.sessions = new Map(); A.users = new Map(); A.events = new Map(); A.cats = new Map();
  A.customers = new Map(); A.instr = new Map(); A.apis = new Map(); A.errors = [];
  A.hour = Array(24).fill(0); A.day = new Map();
  A.failReasons = new Map(); A.rejects = new Map(); A.created = [];
  const ev = (n) => list.filter((r) => r.event_name === n);
  const userOf = (u) => { if (!A.users.has(u)) A.users.set(u, { u, sessions: new Set(), events: 0, actions: 0, api: 0, wall: 0, role: "", first: 0, active: 0, started: 0, created: 0, cancelled: 0, failed: 0, errors: 0, last: 0, instrs: new Set(), customers: new Set(), courses: new Map(), bookDays: new Map(), bookHours: new Map() }); return A.users.get(u); };
  for (const r of list) {
    const u = uname(r), U = userOf(u), t = new Date(r.ts).getTime();
    U.sessions.add(r.session_id); U.events++; U.last = Math.max(U.last, t);
    U.first = U.first ? Math.min(U.first, t) : t;
    if (r.category === "api") U.api++; else U.actions++;
    if (r.user_role && !U.role) U.role = r.user_role;
    if (r.instructor_id) U.instrs.add(r.instructor_id);
    if (cust(r)) U.customers.add(cust(r));
    if (r.event_name === "booking_created") {
      const c = props(r).course;
      if (c) inc(U.courses, c);
      if (r.slot_date) inc(U.bookDays, String(r.slot_date).slice(0, 10));
      if (r.slot_start) inc(U.bookHours, String(r.slot_start).slice(0, 2));
    }
    inc(A.cats, r.category);
    if (r.category !== "api") inc(A.events, r.event_name);
    if (r.category === "user_action") { A.hour[new Date(r.ts).getHours()]++; inc(A.day, new Date(r.ts).toLocaleDateString()); }
    let S = A.sessions.get(r.session_id);
    if (!S) A.sessions.set(r.session_id, (S = { id: r.session_id, user: u, first: t, last: t, n: 0, errors: 0, created: 0, started: 0, active: null, device: r.device }));
    S.n++; S.last = Math.max(S.last, t); S.first = Math.min(S.first, t);
    if (r.category === "error" || r.success === false) { S.errors++; U.errors++; }
    if (r.event_name === "booking_started") { S.started++; U.started++; }
    if (r.event_name === "booking_created") { S.created++; U.created++; }
    if (r.event_name === "booking_cancelled") U.cancelled++;
    if (r.event_name === "booking_failed" || r.event_name === "booking_validation_failed") U.failed++;
    if (r.event_name === "dashboard_closed" && props(r).active_ms != null) { S.active = Number(props(r).active_ms); }
    if (cust(r)) {
      let C = A.customers.get(cust(r));
      if (!C) A.customers.set(cust(r), (C = { name: cust(r), events: 0, started: 0, created: 0, cancelled: 0, failed: 0, by: new Set(), last: 0 }));
      C.events++; C.by.add(u); C.last = Math.max(C.last, t);
      if (r.event_name === "booking_started") C.started++;
      if (r.event_name === "booking_created") C.created++;
      if (r.event_name === "booking_cancelled") C.cancelled++;
      if (r.event_name === "booking_failed" || r.event_name === "booking_validation_failed") C.failed++;
    }
    if (r.instructor_id) {
      let I = A.instr.get(r.instructor_id);
      if (!I) A.instr.set(r.instructor_id, (I = { id: r.instructor_id, events: 0, picks: 0, created: 0, added: 0, last: 0 }));
      I.events++; I.last = Math.max(I.last, t);
      if (["booking_started", "booking_class_added", "booking_slot_changed"].includes(r.event_name)) I.picks++;
      if (r.event_name === "booking_created") I.created++;
      if (r.event_name === "instructor_added") I.added++;
    }
    if (r.category === "api" && r.api_name) {
      let P = A.apis.get(r.api_name);
      if (!P) A.apis.set(r.api_name, (P = { name: r.api_name, n: 0, fail: 0, d: [], last: 0 }));
      P.n++; P.last = Math.max(P.last, t);
      if (r.success === false) P.fail++;
      if (r.duration_ms != null) P.d.push(r.duration_ms);
    }
    if (r.category === "error" || r.success === false) A.errors.push(r);
    if (r.event_name === "booking_failed" || r.event_name === "booking_validation_failed") inc(A.failReasons, r.error_message || "(no message)");
    if (r.event_name === "slot_double_clicked" && r.success === false) inc(A.rejects, r.error_message || "(unknown)");
    if (r.event_name === "booking_created") A.created.push(r);
  }
  for (const U of A.users.values()) { U.active = 0; }
  // Screen time is the sum of each of the user's session spans (first..last
  // event of every tab they opened). Active time only exists for sessions that
  // sent dashboard_closed, so an open tab contributes wall time but not active.
  for (const S of A.sessions.values()) {
    const U = A.users.get(S.user);
    if (!U) continue;
    if (S.last > S.first) U.wall += S.last - S.first;
    if (S.active != null) U.active += S.active;
  }
  A.n = (name) => ev(name).length;
  return A;
}

let liveRows = [], liveCursor = null, livePaused = false, liveNew = 0, liveChecked = null;
// A row is shown at most once, whatever the server returns. Belt and braces on
// top of the exact-cursor fix: if a poll ever overlaps the previous one, the
// repeats are dropped here instead of piling up in the feed.
const liveSeen = new Set();
const rowKey = (r) => [r.received_at, r.session_id, r.ts, r.event_name].join("|");
function noteSeen(r) {
  const u = uname(r), t = new Date(r.received_at || r.ts).getTime();
  if (t > (lastSeen.get(u) || 0)) lastSeen.set(u, t);
}

  el.className = "pill " + (act.length ? "ok" : "");
}
// The analytics Range selector also bounds the live feed: entries older than
// the window are hidden, and "all" shows everything the feed has kept.
function liveSinceMs() {
  const v = $("#range") && $("#range").value;
  const ms = { "1h": 36e5, "6h": 6 * 36e5, "24h": 24 * 36e5, "7d": 7 * 864e5, "30d": 30 * 864e5 }[v];
  return ms == null ? Infinity : ms;
}
function rangeLabel() {
  const el = $("#range");
  if (!el || !el.selectedOptions || !el.selectedOptions[0]) return "all time";
  return el.selectedOptions[0].textContent.trim();
}
function liveFiltered() {
  const u = $("#userf").value, cat = $("#lcat") ? $("#lcat").value : "", q = $("#lq") ? $("#lq").value.toLowerCase() : "";
  const since = Date.now() - liveSinceMs();
  return liveRows.filter((r) => (!u || uname(r) === u) && (!cat || (cat === "noapi" ? r.category !== "api" : r.category === cat)) && (!q || JSON.stringify(r).toLowerCase().includes(q)) && new Date(r.received_at || r.ts).getTime() >= since);
}
function renderLiveShell() {

    <button id="lpause">Pause</button><button id="lclear">Clear</button>
    <select id="lcat"><option value="noapi">Actions + errors (hide API)</option><option value="">Everything</option><option value="user_action">User actions only</option><option value="api">API only</option><option value="error">Errors only</option></select>
    <input type="text" id="lq" placeholder="filter text (event, customer, instructor...)" size="34">
    <span class="muted" id="lmeta"></span></div><div class="card" id="lbody"></div>`;
  $("#lpause").onclick = () => { livePaused = !livePaused; $("#lpause").textContent = livePaused ? "Resume" : "Pause"; paintLive(); };
  $("#lclear").onclick = () => { liveRows = []; paintLive(); };
  // Wrapped, not `= paintLive`: the browser would pass the Event as paintLive's
  // first argument (the set of rows to highlight) and the render would throw.
  $("#lcat").onchange = $("#lq").oninput = () => paintLive();
}
function paintLive(newIds = new Set()) {
  if (!$("#lbody")) return;
  const list = liveFiltered().slice().reverse().slice(0, 400);
  $("#lbody").innerHTML = list.length ? `<table><thead><tr><th>When</th><th>Sales agent</th><th>Type</th><th>Event</th><th>Result</th><th>Details</th></tr></thead><tbody>${list.map((r) => eventRow(r, newIds.has(r) ? "new" : "")).join("")}</tbody></table>` : '<div class="empty">No matching events yet. Use the Sales Dashboard in another tab and they appear here within a few seconds.</div>';
  $("#ldot").className = "dot" + (livePaused ? " off" : "");
  $("#lstat").textContent = livePaused ? "paused" : "live";
  $("#lmeta").textContent = `${list.length} shown, ${liveNew} new since this page opened` + (liveChecked ? `, checked ${tm(liveChecked)}` : "") + `, range: ${rangeLabel()}`;
}
async function pollLive() {
  if (livePaused) return;
  try {
    const j = await api("/api/live" + (liveCursor ? "?after=" + encodeURIComponent(liveCursor) : ""));
    liveChecked = Date.now();
    const fresh = j.rows || [];
    if (fresh.length) {
      const isFirst = !liveCursor;
      liveCursor = fresh.reduce((m, r) => (r.received_at > m ? r.received_at : m), liveCursor || "");
      const marks = new Set();
      for (const r of fresh) {
        const k = rowKey(r);
        if (liveSeen.has(k)) continue;
        liveSeen.add(k);
        noteSeen(r); liveRows.push(r);
        if (!isFirst) { marks.add(r); liveNew++; }
      }
      if (liveRows.length > 2000) liveRows = liveRows.slice(-2000);
      paintLive(marks);
    } else { paintLive(); }
    renderActive();
    setHealthAge();
  } catch (e) { $("#lstat") && ($("#lstat").textContent = "live feed error: " + e.message); }
}

// ------------------------------------------------------------------- drawer
function openSession(id) {
  const list = rows.filter((r) => r.session_id === id);
  $("#dtitle").textContent = `Session ${id.slice(0, 8)} - ${list.length ? uname(list[0]) : ""} - ${list.length ? dt(list[0].ts) : ""}`;
  $("#dbody").innerHTML = eventTable(list);
  $("#drawer").classList.add("open");
}
$("#dclose").onclick = () => $("#drawer").classList.remove("open");

// -------------------------------------------------------------------- load
const TABS = [["live", "Live"], ["overview", "Overview"], ["users", "Sales agents"], ["usersummary", "Team performance"], ["sessions", "Sessions"], ["bookings", "Bookings"], ["customers", "Customers"], ["instructors", "Instructors"], ["api", "API health"], ["errors", "Errors"]];
let tab = "live";
function showTab(t) {
  tab = t;
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button class="${k === t ? "on" : ""}" data-t="${k}">${l}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => showTab(b.dataset.t)));
  document.querySelectorAll("main section").forEach((s) => s.classList.toggle("on", s.id === "t-" + t));
}
function banners() {
  const b = [];
  if (health && health.unreachable && PUBLIC_MODE) {
    b.push(`<div class="banner bad"><b>Cannot reach the database.</b> Check your internet connection and reload.</div>`);
  } else if (health && health.unreachable) {
    // fetch() itself failed: this is NOT a database problem. Either the local
    // server is not running, or this file was opened straight from disk.
    const fromFile = location.protocol === "file:";
    b.push(`<div class="banner bad"><b>Cannot reach the local monitoring server.</b> ${fromFile ? "You opened the .html file directly, which cannot talk to the server." : "The server is not running (or was stopped)."}<br>
      Start it by double-clicking <code>start-monitor.cmd</code> in the monitoring-window folder (or run <code>node server.mjs</code> there), then open <a href="http://127.0.0.1:4455/" style="color:inherit"><code>http://127.0.0.1:4455/</code></a>.</div>`);
  } else if (health && !health.ok) {
    const msg = [errText(health.error), errText(health.body), health.status ? `HTTP ${health.status}` : ""].filter(Boolean).map(esc).join(" \u00b7 ");
    b.push(`<div class="banner bad"><b>Cannot read the logs table.</b> ${msg || esc("The database refused the read.")}${health.hint ? "<br>" + esc(health.hint) : ""}</div>`);
  }
  $("#banners").innerHTML = b.join("");
}
function setHealthAge() {
  const el = $("#health");
  if (!health) return;
  if (!health.ok) { el.textContent = health.unreachable ? (PUBLIC_MODE ? "offline" : "server not running") : "table unreadable"; el.className = "pill bad"; return; }
  const newest = liveRows.length ? liveRows[liveRows.length - 1].received_at : health.newest?.received_at;
  const age = newest ? Date.now() - new Date(newest).getTime() : null;
  el.textContent = `connected - ${nf(health.total)} rows in table - newest ${newest ? ago(newest) : "never"}`;
  el.className = "pill " + (age == null ? "warn" : age < 15 * 60 * 1000 ? "ok" : "warn");
}
function sinceIso() {
  const v = $("#range").value;
  if (v === "all") return null;
  const ms = { "1h": 36e5, "6h": 6 * 36e5, "24h": 24 * 36e5, "7d": 7 * 864e5, "30d": 30 * 864e5 }[v];
  return new Date(Date.now() - ms).toISOString();
}
function renderAll() {
  const u = $("#userf").value;
  const A = analyze(u ? rows.filter((r) => uname(r) === u) : rows);
  renderOverview(A); renderUsers(A); renderUserSummary(A); renderSessions(A); renderBookings(A); renderCustomers(A); renderInstructors(A); renderApi(A); renderErrors(A);
}
async function load(opts = {}) {
  try {
    const since = sinceIso();
    const [h, r, n] = await Promise.all([api("/api/health"), api("/api/rows" + (since ? "?since=" + encodeURIComponent(since) : "")), api("/api/instructors").catch(() => ({}))]);
    health = h; names = n;
    rows = (r.rows || []).slice().sort((a, b) => new Date(a.ts) - new Date(b.ts));
    rows.forEach(noteSeen);
    const cur = $("#userf").value;
    const users = [...new Set(rows.map(uname))].sort();
    $("#userf").innerHTML = '<option value="">All agents</option>' + users.map((u) => `<option ${u === cur ? "selected" : ""}>${esc(u)}</option>`).join("");
    banners(); setHealthAge(); renderActive(); renderAll();
    if (r.truncated) $("#banners").insertAdjacentHTML("beforeend", '<div class="banner warn">Row cap reached: analytics cover only the newest rows in this range. Pick a shorter range for exact totals.</div>');
    if (opts.refreshLive) {
      // Manual Reload / range change: also restart the live feed so both feel
      // responsive on whatever tab is showing. Auto-refresh (setInterval) does
      // not do this -- it would wipe the tail every minute.
      liveRows = []; liveCursor = null; liveSeen.clear(); liveNew = 0;
      pollLive();
    }
  } catch (e) {
    // A TypeError from fetch() means the request never reached a server.
    health = { ok: false, unreachable: e instanceof TypeError, error: { message: e.message }, hint: e.hint };
    banners(); setHealthAge();
  }
}

// ------------------------------------------------------------------- login
// Public site only (local mode is private to this machine and is not gated).
//
// HONEST LIMITS: this is a gate on the PAGE. The data functions it calls stay
// callable with the public anon key, so anyone who reads the code can fetch the
// same (already sanitized) data without this page. What it does do: keep casual
// visitors out, and request NOTHING from the database until sign-in succeeds.
// The ID and password are not in the repo -- config.js holds only a salted
// PBKDF2-SHA256 hash of both, so a leak of the repo does not hand them over
// (it does allow offline guessing, which the 200k iterations slow down).
const AUTH_KEY = "monitoring_auth_v1";
const AUTH_TTL_MS = 8 * 60 * 60 * 1000; // sign in again after 8 hours
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
const unhex = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)));

async function derive(id, pw, a) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(id.trim().toLowerCase() + "\u0000" + pw), "PBKDF2", false, ["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: unhex(a.salt), iterations: a.iterations }, key, 256));
}
// Constant-time compare of two equal-length hex strings.
function sameHash(x, y) {
  if (x.length !== y.length) return false;
  let d = 0;
  for (let i = 0; i < x.length; i++) d |= x.charCodeAt(i) ^ y.charCodeAt(i);
  return d === 0;
}
// The stored token is bound to the CURRENT hash, so changing the password in
// config.js signs everyone out, and a hand-made "ok" value cannot pass.
function isAuthed() {
  try {
    const t = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
    return !!t && t.h === CFG.auth.hash && Date.now() - t.at < AUTH_TTL_MS;
  } catch { return false; }
}
function signOut() { try { localStorage.removeItem(AUTH_KEY); } catch {} location.reload(); }

let booted = false;
function boot() {
  if (booted) return;
  booted = true;
  document.body.classList.remove("locked");
  $("#gate").classList.remove("show");
  if (PUBLIC_MODE) { $("#logout").style.display = ""; $("#logout").onclick = signOut; }
  $("#reload").onclick = () => load({ refreshLive: true });
  $("#range").onchange = () => load({ refreshLive: true });
  $("#userf").onchange = () => { renderAll(); paintLive(); };
  setInterval(() => { if ($("#auto").checked) load(); }, REFRESH_MS);
  setInterval(renderActive, 5000);
  showTab("live");
  renderLiveShell();
  load().then(pollLive);
  setInterval(pollLive, POLL_MS);
}

let failures = 0;
function showGate() {
  document.body.classList.add("locked");
  $("#gate").classList.add("show");
  const err = (m) => { $("#gerr").textContent = m; };
  if (!CFG.auth || !CFG.auth.hash || !CFG.auth.salt) { err("Sign-in is not configured. Contact the site owner."); $("#gform").querySelectorAll("input,button").forEach((e) => (e.disabled = true)); return; }
  if (!(window.crypto && crypto.subtle)) { err("This browser cannot verify sign-in (needs HTTPS). Try a current browser."); $("#gform").querySelectorAll("input,button").forEach((e) => (e.disabled = true)); return; }
  setTimeout(() => $("#gid").focus(), 50);
  $("#gform").onsubmit = async (e) => {
    e.preventDefault();
    const btn = $("#gbtn");
    btn.disabled = true; err("");
    // Slow down repeated wrong guesses (client-side only; deters, does not prevent).
    if (failures > 0) await new Promise((r) => setTimeout(r, Math.min(failures, 6) * 1000));
    let ok = false;
    try { ok = sameHash(await derive($("#gid").value, $("#gpw").value, CFG.auth), CFG.auth.hash); } catch { err("Sign-in failed. Please try again."); btn.disabled = false; return; }
    if (ok) {
      try { localStorage.setItem(AUTH_KEY, JSON.stringify({ h: CFG.auth.hash, at: Date.now() })); } catch {}
      $("#gpw").value = "";
      boot();
    } else {
      failures++;
      err("Incorrect ID or password.");
      $("#gpw").value = ""; $("#gpw").focus();
      btn.disabled = false;
    }
  };
}

// Gate only the public site. Fail closed: a public build with no auth config
// shows the (disabled) sign-in screen and never boots.
if (PUBLIC_MODE && !isAuthedSafe()) showGate(); else boot();
function isAuthedSafe() { return !!(CFG.auth && CFG.auth.hash) && isAuthed(); }
</script>
